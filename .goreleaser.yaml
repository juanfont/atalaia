version: 2

project_name: atalaia

before:
  hooks:
    - go mod tidy

builds:
  - id: atalaia
    main: ./cmd/atalaia
    binary: atalaia
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/juanfont/atalaia.Version={{ .Version }}

archives:
  - id: atalaia
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - gitleaks-aggressive.toml
      - prompts/*

dockers:
  - id: atalaia-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-amd64'
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/juanfont/atalaia
      - --label=org.opencontainers.image.title=atalaia
      - --label=org.opencontainers.image.description=Secret-scan filter with a local LLM
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=BSD-3-Clause
    extra_files:
      - prompts
      - LICENSE
      - README.md
      - gitleaks-aggressive.toml

  - id: atalaia-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-arm64'
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/juanfont/atalaia
      - --label=org.opencontainers.image.title=atalaia
      - --label=org.opencontainers.image.description=Secret-scan filter with a local LLM
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=BSD-3-Clause
    extra_files:
      - prompts
      - LICENSE
      - README.md
      - gitleaks-aggressive.toml

docker_manifests:
  - name_template: 'ghcr.io/juanfont/atalaia:{{ .Version }}'
    image_templates:
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-amd64'
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/juanfont/atalaia:latest'
    image_templates:
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-amd64'
      - 'ghcr.io/juanfont/atalaia:{{ .Version }}-arm64'

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - '^ci:'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

release:
  draft: false
  prerelease: auto
